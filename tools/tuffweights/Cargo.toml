[package]
name = "tuffweights"
version = "0.1.0"
edition = "2021"
description = "Offline stat-weight and weapon-ranking calculator for TuFFlevels rogue leveling research"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
rayon = "1"
clap = { version = "4", features = ["derive"] }
anyhow = "1"

[profile.release]
opt-level = 3
lto = true
